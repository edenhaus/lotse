name: Release build

# The static musl release binaries, natively on each arch, with the size check. ci.yml calls it on
# every push and PR (cached); release.yml calls it for a release, with the tag's version and no
# cache, so nothing a cache holds can reach a released binary.

on:
  workflow_call:
    inputs:
      release:
        description: "A release build: restores no cache"
        type: boolean
        default: false
      version:
        description: "The version to build, set in the workspace first (a release's, from its tag)"
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  musl:
    name: Release binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # Each arch on its own runner, natively (as CI's Build): libopus is built by cmake, which
        # archives with the host's ranlib, so no build depends on a ranlib for a foreign arch.
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      ARCH: ${{ matrix.arch }}
      BIN: target/${{ matrix.arch }}-unknown-linux-musl/release/lotse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
          # What the build needs; the rest of mise.toml is for the checks.
          install_args: rust zig cmake github:rust-cross/cargo-zigbuild github:rust-secure-code/cargo-auditable
          cache: ${{ !inputs.release }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !inputs.release }}
        with:
          shared-key: release-${{ matrix.arch }}
      - if: inputs.version != ''
        run: mise run set-version "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
          MISE_AUTO_INSTALL: "false"
      - run: mise run release-build "$ARCH"
        env:
          MISE_AUTO_INSTALL: "false" # the tools above, not the whole mise.toml
      - name: Size check (< 15 MB)
        run: |
          size=$(stat -c %s "$BIN")
          echo "lotse: $size bytes"
          test "$size" -lt 15728640
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lotse-${{ matrix.arch }}
          path: ${{ env.BIN }}
          if-no-files-found: error
