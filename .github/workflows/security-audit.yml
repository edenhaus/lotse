name: security-audit

on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
    paths: [Cargo.lock, fuzz/Cargo.lock, .cargo/deny.toml]
  pull_request:
    paths: [Cargo.lock, fuzz/Cargo.lock, .cargo/deny.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.15
      - run: mise run audit
