name: browser

# The browser test (scripts/browser.sh): one pytest test in tests/browser/, run once per browser
# and case (PCMU and AAC after join, after a PLI, a camera reconnect and a worker crash), has
# Selenium drive a real browser that plays the synthetic camera (ffmpeg publishing to MediaMTX,
# both pinned in mise.toml) through a release daemon and the dev viewer, and checks what it
# showed, played and reported in getStats(). Chrome and Firefox on GitHub's x86-64 Linux runner,
# Safari on its macOS runner; CI uses GitHub's hosted runners only. The browsers are the runner
# images' own, current stable releases, their drivers the ones Selenium Manager resolves, and each
# report records the versions that ran. Nightly and by hand.
#
# The `compare` job plays the same page and camera through lotse and through go2rtc as its common
# deployment configures it (scripts/compare.sh, tests/browser/test_comparison.py), alternating,
# and uploads the side-by-side report; Chrome on Linux only. go2rtc's figures, its failed checks
# and its runs that did not play are reported, never judged: the job fails only when one of
# lotse's runs fails the browser test's own checks.

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      play:
        description: "How long each browser plays after its first frame (20s, 2m)"
        type: string
        default: "20s"
      runs:
        description: "The comparison's plays through each server"
        type: string
        default: "5"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PLAY: ${{ inputs.play || '20s' }}
  RUNS: ${{ inputs.runs || '5' }}

jobs:
  browser:
    name: ${{ matrix.engine }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: the release daemon's musl build (as in build.yml) and the camera's tools.
          - engine: chrome
            os: ubuntu-latest
            tools: rust zig cmake github:rust-cross/cargo-zigbuild github:bluenviron/mediamtx github:BtbN/FFmpeg-Builds uv
            # Ubuntu 24.04's AppArmor keeps Chrome's sandbox from the user namespaces it needs;
            # the page it loads is the test's own, on loopback.
            browser_args: --no-sandbox
          - engine: firefox
            os: ubuntu-latest
            tools: rust zig cmake github:rust-cross/cargo-zigbuild github:bluenviron/mediamtx github:BtbN/FFmpeg-Builds uv
            browser_args: ""
          # macOS: the host build (cmake builds libopus; no musl, so no zig), ffmpeg from the
          # macOS arm64 build in mise.toml (GitHub's macos-latest is arm64).
          - engine: safari
            os: macos-latest
            tools: rust cmake github:bluenviron/mediamtx http:ffmpeg uv
            browser_args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.15
          # What the build and the camera need, and uv for the test's Python; the rest of
          # mise.toml is for the checks.
          install_args: ${{ matrix.tools }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: browser
      # Safari's WebDriver is off until an administrator turns it on; the hosted runner allows it.
      - if: matrix.engine == 'safari'
        run: sudo safaridriver --enable
      - run: mise run browser "$ENGINE" "$PLAY"
        env:
          ENGINE: ${{ matrix.engine }}
          MISE_AUTO_INSTALL: "false" # the tools above, not the whole mise.toml
          LOTSE_BROWSER_ARGS: ${{ matrix.browser_args }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-${{ matrix.engine }}
          path: target/browser-${{ matrix.engine }}/
          if-no-files-found: warn

  compare:
    name: go2rtc comparison (chrome on ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.15
          # The browser job's Linux tools, and go2rtc.
          install_args: rust zig cmake github:rust-cross/cargo-zigbuild github:bluenviron/mediamtx github:BtbN/FFmpeg-Builds uv github:AlexxIT/go2rtc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: browser
      - run: mise run compare chrome "$RUNS" "$PLAY"
        env:
          MISE_AUTO_INSTALL: "false" # the tools above, not the whole mise.toml
          # As in the browser job: Ubuntu 24.04's AppArmor keeps Chrome's sandbox from its user
          # namespaces.
          LOTSE_BROWSER_ARGS: --no-sandbox
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compare-chrome
          path: target/compare-chrome/
          if-no-files-found: warn
