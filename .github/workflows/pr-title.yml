name: PR title

# PRs are squash-merged, so the PR title becomes the commit, and Release Drafter sorts the release
# notes and picks the next version by it (.github/release-drafter.yml). Apart from ci.yml on
# purpose: it runs when a title is edited, which must not run all of CI.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read # the action reads the PR title; it never writes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commit:
    name: Title is a Conventional Commit
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
