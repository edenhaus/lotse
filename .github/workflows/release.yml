name: Release

# The release pipeline, which ci.yml calls on every push to main, one at a time and never
# cancelled.
#
# Every push to main: release-plz opens or updates the release PR, which bumps the version and
# writes CHANGELOG.md from the Conventional Commits (.release-plz.toml). When that PR is merged,
# the same run tags the merge commit, opens a draft release with the changelog as its notes,
# builds both targets with build.yml (without any cache), writes the SBOMs and the license notices, pushes the
# scratch image to ghcr.io, attests all of it and publishes the release.
#
# Everything after the tag happens in this one run, on purpose: a tag or a release made with
# GITHUB_TOKEN starts no other workflow, so an `on: push: tags` workflow would never fire. The
# release PR is the one thing made with the lotse bot's token, so that CI runs on it.

on:
  workflow_call:
    secrets:
      LOTSE_BOT_PRIVATE_KEY:
        description: "The lotse bot GitHub App's private key, which opens the release PR"
        required: false # checked by the release-pr job, with a message

permissions: {}

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: "false" # each job installs the tools it names, not the whole mise.toml

jobs:
  release:
    name: Tag and draft the release (release-plz)
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the draft release
      pull-requests: read # release-plz checks that this commit is a merged release PR
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release-plz finds the last release among the tags
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.15
          install_args: rust github:release-plz/release-plz
          cache: false # nothing cached reaches a release job
      - name: Tag and draft the release
        id: release
        env:
          GIT_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          out="$(release-plz release --forge github --repo-url "$REPO_URL" --output json)"
          echo "$out"
          tag="$(jq -r '.releases[] | select(.package_name == "lotse") | .tag' <<<"$out")"
          version="$(jq -r '.releases[] | select(.package_name == "lotse") | .version' <<<"$out")"
          if [ -z "$tag" ]; then
            echo "Nothing to release: this commit is not a merged release PR."
            exit 0
          fi
          # build.yml builds this run's commit, so the tag must name that commit.
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$tag is $tagged, not this run's commit $GITHUB_SHA"
            exit 1
          fi
          { echo "tag=$tag"; echo "version=$version"; } >> "$GITHUB_OUTPUT"

  release-pr:
    name: Open or update the release PR (release-plz)
    # After `release`, so a release just tagged is not offered again.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the lotse bot is configured
        env:
          CLIENT_ID: ${{ vars.LOTSE_BOT_CLIENT_ID }}
          HAS_KEY: ${{ secrets.LOTSE_BOT_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error::The release PR is opened with the lotse bot GitHub App, so that CI runs on it: set the LOTSE_BOT_CLIENT_ID variable and the LOTSE_BOT_PRIVATE_KEY secret, and install the App on this repository with Contents and Pull requests read and write."
            exit 1
          fi
      # A PR opened with GITHUB_TOKEN starts no workflow, so its checks would never run.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.LOTSE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LOTSE_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # the release branch and its commit
          permission-pull-requests: write # the release PR
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release-plz reads the commits since the last tag
          persist-credentials: false # release-plz commits and pushes through the GitHub API
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.15
          install_args: rust github:release-plz/release-plz
          cache: false
      - name: Open or update the release PR
        env:
          GIT_TOKEN: ${{ steps.app.outputs.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: release-plz release-pr --forge github --repo-url "$REPO_URL"

  build:
    name: Build
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
    # A job-level `./` call takes the workflow from this run's commit, not from the runner's
    # disk; `$/`, which zizmor prefers, is rejected by actionlint 1.7.12, the latest.
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    with:
      release: true

  notices:
    name: SBOMs and license notices
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.15
          install_args: rust github:EmbarkStudios/cargo-about github:CycloneDX/cyclonedx-rust-cargo
          cache: false
      - run: mise run sbom
      - run: mise run licenses
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notices
          path: target/dist/
          if-no-files-found: error

  image:
    name: Push and attest the image
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # the Sigstore certificate of the attestation
      attestations: write # store the attestation
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lotse-*
          path: artifacts
      - name: Put the binaries where scripts/image.sh takes them
        run: |
          for arch in x86_64 aarch64; do
            install -D -m 0755 "artifacts/lotse-$arch/lotse" "target/$arch-unknown-linux-musl/release/lotse"
          done
      # ghcr.io takes lowercase names only. The owner is not written down: the repository may
      # move to another organization.
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: echo "image=ghcr.io/${OWNER,,}/${NAME,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Build and push
        id: push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          scripts/image.sh push "$IMAGE" "$VERSION"
          digest="$(cat target/dist/image-digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image: \`$IMAGE:$VERSION@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # needs `artifact-metadata: write`, and nothing reads it
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io

  publish:
    name: Attest, checksum and publish the release
    needs: [release, build, notices, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the assets to the draft release and publish it
      id-token: write # the Sigstore certificate of the attestations
      attestations: write # store the attestations
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Name the assets
        run: |
          mkdir dist
          for arch in x86_64 aarch64; do
            install -m 0755 "artifacts/lotse-$arch/lotse" "dist/lotse-$arch-unknown-linux-musl"
          done
          cp artifacts/notices/* dist/
          ls -l dist
      - name: Attest the binaries' provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/lotse-*-unknown-linux-musl
      - name: Attest the x86_64 binary's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/lotse-x86_64-unknown-linux-musl
          sbom-path: dist/lotse-x86_64-unknown-linux-musl.cdx.json
      - name: Attest the aarch64 binary's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/lotse-aarch64-unknown-linux-musl
          sbom-path: dist/lotse-aarch64-unknown-linux-musl.cdx.json
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Upload the assets and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release upload "$TAG" dist/*
          gh release view "$TAG" --json body --jq .body > notes.md
          # shellcheck disable=SC2016 # envsubst's variable list, expanded by envsubst, not the shell
          envsubst '$IMAGE $VERSION $DIGEST $GH_REPO' >> notes.md <<'EOF'

          ## Container image

          `$IMAGE:$VERSION@$DIGEST` (linux/amd64, linux/arm64): `/lotse` and nothing else.

          ```dockerfile
          COPY --from=$IMAGE:$VERSION@$DIGEST /lotse /bin/lotse
          ```

          ## Verify

          ```sh
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify lotse-x86_64-unknown-linux-musl --repo $GH_REPO
          gh attestation verify oci://$IMAGE:$VERSION --repo $GH_REPO
          ```
          EOF
          gh release edit "$TAG" --notes-file notes.md --draft=false --latest
