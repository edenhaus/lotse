name: Release

# The release, when a release is published on GitHub: CI's Release notes job keeps the draft up to
# date from the merged PRs (Release Drafter, .github/release-drafter.yml), and publishing it, by
# hand, tags the commit and starts this.
#
# Apart from ci.yml on purpose: this workflow publishes, so no job in it restores a cache (cache
# poisoning, zizmor's cache-poisoning audit); ci.yml's jobs all do. Everything happens in this one run: the version is taken from
# the tag and set in the workspace, both targets are built with build.yml (without any cache), the
# SBOMs and license notices written, the scratch image pushed to ghcr.io, all of it attested and
# attached to the release, and the image and the verification commands added to its notes.

on:
  release:
    types: [published]

permissions: {}

# One release at a time, never cancelled.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: "false" # each job installs the tools it names, not the whole mise.toml

jobs:
  version:
    name: Version from the tag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG is not v<SemVer>; Release Drafter names releases v<version>"
            exit 1
          fi
          echo "version=${TAG#v}" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    permissions:
      contents: read
    # A job-level `./` call takes the workflow from this run's commit, not from the runner's
    # disk; `$/`, which zizmor prefers, is rejected by actionlint 1.7.12, the latest.
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    with:
      release: true
      version: ${{ needs.version.outputs.version }}

  notices:
    name: SBOMs and license notices
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.9.15
          install_args: rust github:EmbarkStudios/cargo-about github:CycloneDX/cyclonedx-rust-cargo
          cache: false
      - run: mise run set-version "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - run: mise run sbom
      - run: mise run licenses
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notices
          path: target/dist/
          if-no-files-found: error

  image:
    name: Push and attest the image
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # the Sigstore certificate of the attestation
      attestations: write # store the attestation
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lotse-*
          path: artifacts
      - name: Put the binaries where scripts/image.sh takes them
        run: |
          for arch in x86_64 aarch64; do
            install -D -m 0755 "artifacts/lotse-$arch/lotse" "target/$arch-unknown-linux-musl/release/lotse"
          done
      # ghcr.io takes lowercase names only. The owner is not written down: the repository may
      # move to another organization.
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: echo "image=ghcr.io/${OWNER,,}/${NAME,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Build and push
        id: push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          scripts/image.sh push "$IMAGE" "$VERSION"
          digest="$(cat target/dist/image-digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image: \`$IMAGE:$VERSION@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # needs `artifact-metadata: write`, and nothing reads it
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io

  publish:
    name: Attest, checksum and attach to the release
    needs: [version, build, notices, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the assets to the release and add to its notes
      id-token: write # the Sigstore certificate of the attestations
      attestations: write # store the attestations
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Name the assets
        run: |
          mkdir dist
          for arch in x86_64 aarch64; do
            install -m 0755 "artifacts/lotse-$arch/lotse" "dist/lotse-$arch-unknown-linux-musl"
          done
          cp artifacts/notices/* dist/
          ls -l dist
      - name: Attest the binaries' provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/lotse-*-unknown-linux-musl
      - name: Attest the x86_64 binary's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/lotse-x86_64-unknown-linux-musl
          sbom-path: dist/lotse-x86_64-unknown-linux-musl.cdx.json
      - name: Attest the aarch64 binary's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/lotse-aarch64-unknown-linux-musl
          sbom-path: dist/lotse-aarch64-unknown-linux-musl.cdx.json
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Upload the assets and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release upload "$TAG" dist/*
          gh release view "$TAG" --json body --jq .body > notes.md
          # shellcheck disable=SC2016 # envsubst's variable list, expanded by envsubst, not the shell
          envsubst '$IMAGE $VERSION $DIGEST $GH_REPO' >> notes.md <<'EOF'

          ## Container image

          `$IMAGE:$VERSION@$DIGEST` (linux/amd64, linux/arm64): `/lotse` and nothing else.

          ```dockerfile
          COPY --from=$IMAGE:$VERSION@$DIGEST /lotse /bin/lotse
          ```

          ## Verify

          ```sh
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify lotse-x86_64-unknown-linux-musl --repo $GH_REPO
          gh attestation verify oci://$IMAGE:$VERSION --repo $GH_REPO
          ```
          EOF
          gh release edit "$TAG" --notes-file notes.md
