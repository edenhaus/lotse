name: clients

# A change to the API schema on main asks lotse-clients to sync it: its sync-schema.yml opens
# or updates a PR with the schema and the regenerated models, whose CI runs the contract
# tests against this commit.
on:
  push:
    branches: [main]
    paths: [crates/lotse-api-types/schema/api.json]

permissions: {}

# The newest schema is the one to sync; lotse-clients' run supersedes an older one anyway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: ask lotse-clients to sync the schema
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN reaches only this repository.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.LOTSE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.LOTSE_BOT_PRIVATE_KEY }}
          repositories: lotse-clients
          permission-contents: write # what a repository_dispatch needs
      - name: Dispatch lotse-schema
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ github.sha }}
        run: gh api repos/edenhaus/lotse-clients/dispatches -f event_type=lotse-schema -f "client_payload[sha]=$SHA"
