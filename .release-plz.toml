# release-plz: the version and changelog PR from the Conventional Commits on main, then, once
# that PR is merged, the tag and a draft GitHub release that release.yml builds, fills and
# publishes.
#
# Only the `lotse` binary is a product. The library crates are internal (`publish = false` in the
# workspace), share the workspace version and are never released on their own: their commits go
# into the binary's changelog. Nothing goes to crates.io.

[workspace]
git_only = true # the last release is the newest `v*` tag; nothing is on a registry, so nothing is published
release_always = false # release only from the merged release PR, not on every push to main
semver_check = false # a binary; the control API has its own version
dependencies_update = false # Renovate updates the lockfile
git_tag_name = "v{{ version }}"
git_release_name = "lotse {{ version }}"
git_release_draft = true # release.yml attaches the binaries, SBOMs, licenses and checksums, then publishes
pr_name = "chore(release): lotse {{ version }}" # a Conventional Commit: the squash-merged title is the commit
# The libraries are analyzed, so that their commits reach the binary's changelog
# (`changelog_include` below), but have no changelog, tag or release of their own.
changelog_update = false
git_tag_enable = false
git_release_enable = false

[[package]]
name = "lotse"
changelog_update = true
git_tag_enable = true
git_release_enable = true
changelog_path = "CHANGELOG.md"
changelog_include = [
  "lotse-api",
  "lotse-api-types",
  "lotse-codec",
  "lotse-core",
  "lotse-ipc",
  "lotse-rtsp",
  "lotse-sandbox",
  "lotse-supervisor",
  "lotse-webrtc",
  "lotse-worker",
]

[[package]]
name = "lotse-testing"
release = false # test tooling, a dev-dependency only: not part of the binary

# What a user of the binary reads: features, fixes, performance and anything breaking
# (`protect_breaking_commits`); tests, docs, CI and chores stay in the git log.
[changelog]
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "added" },
  { message = "^fix", group = "fixed" },
  { message = "^perf", group = "performance" },
  { message = "^revert", group = "reverted" },
  { message = "^(build|chore|ci|docs|refactor|style|test)", skip = true },
  { message = "^.*", group = "other" },
]
