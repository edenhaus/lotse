# Crate layering, enforced by scripts/check_crate_layering.py (a prek hook) against `cargo metadata`.
# This is the crate dependency graph written down ahead of the code: every direct dependency
# edge between workspace crates must be listed under [dependents], a restricted external crate
# may only be a direct dependency of its owners under [external], and a [dev-only] crate may never
# be a normal or build dependency. A [harness] crate's own edges are free of these rules, and no
# crate may depend on it. Adding an edge means editing this file.

[dependents]
# crate = the workspace crates that may depend on it directly
rocko-core = ["rocko-codec", "rocko-tls", "rocko-rtsp", "rocko-http", "rocko-mux", "rocko-webrtc", "rocko-snapshot", "rocko-api", "rocko-supervisor", "rocko-worker", "rocko-testing", "rocko"]
rocko-codec = ["rocko-rtsp", "rocko-http", "rocko-mux", "rocko-webrtc", "rocko-snapshot", "rocko-worker", "rocko-testing", "rocko"] # rocko-worker: the picture size of `stream/get`, read from a track's SPS
rocko-ipc = ["rocko-supervisor", "rocko-worker", "rocko-snapshot", "rocko"] # rocko: dev-only, the talk-back tone test's in-process worker
rocko-sandbox = ["rocko"]
rocko-api-types = ["rocko-tls", "rocko-rtsp", "rocko-http", "rocko-webrtc", "rocko-api", "rocko-supervisor", "rocko", "rocko-testing"] # rocko-tls, rocko-rtsp, rocko-http, rocko-webrtc: the `stream/put` source fields, declared once there and parsed by the factories; rocko-testing: the load generator reads `metrics/get`
rocko-api = ["rocko-supervisor"]
rocko-tls = ["rocko-rtsp", "rocko-http", "rocko-supervisor"] # the sources' TLS client trust; the supervisor's TURN allocations over TLS (`turns:`)
rocko-rtsp = ["rocko"]
rocko-http = ["rocko"] # M6, the factory behind `source-http`
rocko-mux = ["rocko"] # M6, the recording container behind `output-recording`, and the live one behind `output-live`
rocko-hls = ["rocko-api", "rocko-supervisor", "rocko-testing"] # the LL-HLS window of a live output, in the supervisor that serves it; rocko-api: the route parses its names and directives, and sends its chunks; rocko-testing: the dev viewer checks the names it proxies
rocko-webrtc = ["rocko", "rocko-testing"] # rocko: the factories behind `output-webrtc` and `source-webrtc`; rocko-testing: dev-only, its reproduction test of an open str0m issue (Safari's ICE)
rocko-snapshot = ["rocko-supervisor", "rocko"] # M5
rocko-supervisor = ["rocko"]
rocko-worker = ["rocko"]
# Never of rocko-core: it depends on core itself, and a dev-dependency cycle compiles two copies of
# core whose types do not unify. Core's own fakes live behind its `test-util` feature.
rocko-testing = ["rocko-codec", "rocko-tls", "rocko-rtsp", "rocko-http", "rocko-webrtc", "rocko-snapshot", "rocko-api", "rocko-api-types", "rocko-supervisor", "rocko-worker", "rocko"]

[harness]
# rocko-fuzz: the fuzz targets reach into every crate they fuzz, fakes (rocko-testing) included, as
# normal dependencies (a bin has no dev-dependencies); nothing depends on them, nothing ships them.
crates = ["rocko-fuzz"]

[dev-only]
# allocation-counter: its global allocator replaces the daemon's in whatever links it. divan: the
# benchmark harness, whose CLI and timers have no place in the daemon.
crates = ["rocko-testing", "allocation-counter", "divan"]

[external]
# protocol engines and process-specific crates stay inside the crate that owns them
retina = ["rocko-rtsp"]
rtsp-types = ["rocko-rtsp", "rocko-testing"]
sdp-types = ["rocko-rtsp", "rocko-testing"]
m3u8-rs = ["rocko-http"]
mpeg2ts-reader = ["rocko-http"]
mp4-atom = ["rocko-http", "rocko-mux", "rocko"] # reading the HTTP source's fragmented MP4; writing the event recordings'; rocko: dev-only, the end-to-end recording test reads the recordings back
str0m = ["rocko-webrtc", "rocko-testing"]
dimpl = ["rocko-webrtc"] # DTLS of str0m's crypto provider
rustls = ["rocko-tls", "rocko-api", "rocko-testing"] # the sources' TLS client; the control API's TLS listener; the fake camera's TLS mode and the TLS listener's test client
tokio-rustls = ["rocko-tls", "rocko-api", "rocko-testing"]
webpki-roots = ["rocko-tls"]
rustls-webpki = ["rocko-api"] # X.509 parsing of the control identity's certificate (rustls verifies through it on its own)
prometheus-client = ["rocko-api"] # the metrics' exposition encoders
mediatype = ["rocko-api"] # the metrics' `Accept` media ranges
pem = ["rocko-api"] # the control identity's certificate as PEM (rcgen writes its own through it)
rcgen = ["rocko-webrtc", "rocko-api", "rocko-testing"] # the DTLS certificate; the control API's server certificate; the test certificates
axum = ["rocko-api", "rocko-testing"] # the control API; the dev viewer, a test crate never linked into the binary
hyper = ["rocko-api", "rocko-http", "rocko", "rocko-testing"] # the control API's HTTP/1.1 connection, under axum; the HTTP source's client; `rocko ctl recording create`'s GET of the recording's body; the dev viewer's GET of a live output's bytes, a test crate never linked into the binary
hyper-util = ["rocko-api", "rocko-http", "rocko", "rocko-testing"]
http-auth = ["rocko-http"] # the HTTP source's Basic and Digest answers (retina uses it on its own for RTSP)
postcard = ["rocko-ipc"]
landlock = ["rocko-sandbox"]
seccompiler = ["rocko-sandbox"]
opus = ["rocko-codec"]
symphonia = ["rocko-codec"]
rubato = ["rocko-codec"]
nanoaudio-g722 = ["rocko-codec"] # the G.722 decoder of the recordings' audio transcode
adts-reader = ["rocko-codec"] # ADTS of the HTTP source's MPEG-TS, split into raw AAC frames
openh264 = ["rocko-snapshot"]
jpeg-encoder = ["rocko-snapshot"]
clap = ["rocko"]
anyhow = ["rocko"] # AGENTS.md: `anyhow` only in `main`
mimalloc = ["rocko"]
nix = ["rocko-supervisor", "rocko-testing"] # interface enumeration for the host candidates; the DSCP of received datagrams (`rocko_testing::dscp`)
