# cargo-mutants configuration.
# `mise run mutants` runs the changed lines; the nightly job runs the whole workspace.
test_tool = "nextest"
# Test infrastructure: exercised by the other crates' tests and left out of
# the coverage gate for the same reason (mise.toml `coverage-musl`).
exclude_globs = ["crates/lotse-testing/**", "crates/lotse-codec/src/aac/test_data.rs"]
# Equivalent mutants: mutations that cannot change behavior, each with its reason.
# Keep this list short and delete entries with the code they refer to.
exclude_re = [
    # The default body already returns `None`.
    "replace Handler::unsubscribed -> Option<Event> with None",
    # The default body already returns an empty list.
    "replace OutputFactory::session_tracks -> Vec<TrackRequest> with vec!\\[\\]",
    # The arms only pick the log level; the fallback arm logs the same event at debug.
    "delete match arm SessionEvent::(Answer|State|Warning)\\{.*\\} in State::deliver_session",
    # The shifted-in low byte is zero, so `|` and `^` produce the same value.
    "replace \\| with \\^ in encode_ulid",
    # The type preference, local preference and component occupy disjoint bits.
    "replace \\| with \\^ in srflx_candidate",
    # 248 itself maps to 'A' as 248 % 62 == 0: one value of bias, no observable behavior.
    "replace < with <= in random_chars",
    # An equal profile is taken by the arms before, so `>` and `>=` cannot differ there.
    "video/h264.rs:.*replace > with >= in choose_pt$",
    # The profile, constraint and level bytes are shifted into disjoint bits, so `|` and `^`
    # produce the same value.
    "video/h264.rs:.*replace \\| with \\^ in stream_profile_level_id$",
    # The bit shifted in lands in a zero low bit (and ADTS length fields in
    # disjoint bits), so `|` and `^` produce the same value.
    "replace \\| with \\^ in BitReader<'a>::read",
    "replace \\| with \\^ in strip_adts",
    # The AudioSpecificConfig fields of an ADTS header are shifted into disjoint bits.
    "aac/adts.rs:.*replace \\| with \\^ in AdtsConfig::new$",
    # Only picks whether the one-per-connection warning is logged.
    "replace == with != in publish_aac",
    "replace == with != in violation$",
    # A stream's RTP channel is even (`ReceiverReports::set_up` takes no other), so `| 1`
    # and `^ 1` name the same RTCP channel.
    "rtcp.rs:.*replace \\| with \\^ in Report::interleave$",
    # Only logs, rate-limited, why a receiver report did not leave.
    "replace UdpRelay::sent with \\(\\)$",
    # Only picks whether the rate-limited unroutable warning is logged.
    "replace \\|\\| with && in Peers::route",
    "replace == with != in Peers::route",
    # Only logs the talk-back decision; the answer it describes is asserted by the
    # talk-back fixtures.
    "replace log_talkback with \\(\\)",
    # Only picks whether a change of the talk-back codec is logged; the codec is remembered
    # either way.
    "replace match guard old == uplink.codec with (true|false) in TalkbackRx::take",
    # Only the level and message of the talk-back state logs, and whether the end-of-session
    # counters are logged; the states and counters themselves are asserted by the arbitration tests.
    "talkback.rs:.*in log_change$",
    "talkback.rs:.*replace log_change with \\(\\)",
    "talkback.rs:.*in Talkback::log_end$",
    "talkback.rs:.*replace Talkback::log_end with \\(\\)",
    "replace == with != in TalkbackRx::take",
    # Only moves the talk-back flow state that `log_change` and `log_end` log; the
    # verdicts and counters themselves are asserted by the arbitration tests.
    "talkback.rs:.*replace change with \\(\\)",
    "talkback.rs:.*replace == with != in change$",
    # Only logs a talk-back arbitration's outcome; the outcome itself (the claim, the decline,
    # what the answer carries) is asserted by the session tests.
    "sessions.rs:.*replace Arbitration::log with \\(\\)",
    # Only picks whether a failed backchannel probe that proves nothing is logged as a warning;
    # what it remembers (`Probed::refused_with`) and the slot it settles are asserted alike.
    "backchannel/probe.rs:.*delete ! in run$",
    # Only picks whether the one-per-session warning for dropped declines is logged.
    "replace == with != in SessionEntry::declined",
    # G.711's sign (0x80), segment (0x70) and step (0x0f) bits are disjoint, so `|` and `^`
    # produce the same code.
    "g711.rs:.*replace \\| with \\^ in (mu|a)_encode$",
    # The seconds shifted up 32 bits and the fraction below 2^32 occupy disjoint bits.
    "replace \\| with \\^ in ntp_timestamp",
    # The CVO flip bit and the rotation bits are disjoint, so `|` and `^` produce the same byte.
    "cvo.rs:.*replace \\| with \\^ in byte$",
    # H.265 headers (RFC 7798 §1.1.4, §4.4.2, §4.4.3) and the SPS bit reader: the fields
    # OR-ed together occupy disjoint bits, so `|` and `^` produce the same value.
    "h265/nal.rs:.*replace \\| with \\^ in (layer_id|parse|aggregate|fu_indicator|fu)$",
    "h265/sps.rs:.*replace \\| with \\^ in Bits<'a>::bits$",
    # The FU-A indicator and header (RFC 6184 §5.8): F and NRI above the type, S and E above
    # the original type, disjoint bits, so `|` and `^` produce the same value.
    "h264/nal.rs:.*replace \\| with \\^ in fu_part$",
    # A unit of exactly the target goes through `fragment`, which returns it whole, and alone
    # either way: the same payloads in the same order.
    # (Column 27 is `unit.len() > self.max_payload`; the group check after it stays mutated.)
    "h265/packet.rs:\\d+:27: replace > with >= in PacketNormalizer::pack_units",
    # retina's RTP channel is even, so OR-ing in the RTCP bit and XOR-ing it set the same channel.
    "lotse-rtsp/src/udp.rs:.*replace \\| with \\^ in UdpRelay::datagram$",
    # Reading one more piece of the body before the sniff decides the same: it looks at the
    # first bytes only, and every byte read is handed on either way.
    "lotse-http/src/source/mod.rs:.*replace < with <= in sniff$",
    # The open flags and modes are disjoint bits, so `|` and `^` produce the same flags.
    "identity.rs:.*replace \\| with \\^ in (ServerIdentity::load_in|open_directory|write_new)$",
    # `write_new` unlinks the partial file's name just before, in a directory only the owner
    # may write (checked) and only this start uses (locked), and nothing runs a program
    # meanwhile: `O_EXCL`, `O_NOFOLLOW` and `O_CLOEXEC` guard what cannot happen there, so
    # dropping them changes nothing a test can see. Column 60 drops `O_EXCL` and
    # `O_NOFOLLOW`, column 79 `O_NOFOLLOW` and `O_CLOEXEC`.
    "identity.rs:\\d+:(60|79): replace \\| with & in write_new$",
    # A non-blocking `flock` on a directory the daemon just opened fails only with
    # `EWOULDBLOCK` in a test: any other error is refused either way, as in use or as I/O.
    "clients.rs:.*replace match guard err == Errno::WOULDBLOCK with true in ClientStore::open$",
    # A directory sync shows only after a crash: skipping it changes nothing a test can see.
    "clients.rs:.*replace fsync_dir -> io::Result<\\(\\)> with Ok\\(\\(\\)\\)$",
    # `Clip::queue` leaves no empty slice pending, and a write of at least one byte to a pipe
    # writes at least one or fails (POSIX `write`, Linux `pipe(7)`): `Ok(0)` never comes, so
    # the guard, there so it could not loop forever, picks what `true` and `>=` pick.
    "clip.rs:.*replace match guard written > 0 with true in Clip::write$",
    "clip.rs:.*replace > with >= in Clip::write$",
    # A leaked empty Vec is the empty slice: the same (absent) hint list.
    "replace <impl ClientCertVerifier for PinVerifier>::root_hint_subjects -> &\\[DistinguishedName\\] with Vec::leak\\(Vec::new\\(\\)\\)",
]
