[package]
name = "lotse-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "cargo-fuzz targets, one per untrusted input: a member of the root workspace, built for fuzzing by `cargo fuzz build` on the pinned nightly"

[package.metadata]
cargo-fuzz = true

# No `[lints] workspace = true` yet: the targets are harness code that predates the workspace
# lints (a panic is how a target reports a finding; the harnesses drive real sockets on real
# time), so clippy skips this crate (.pre-commit-config.yaml) and the fuzz-check hook type-checks it.

# The workspace's dependencies, with the features the targets drive besides.
[dependencies]
bytes.workspace = true
libfuzzer-sys.workspace = true
lotse-api.workspace = true
lotse-api-types.workspace = true
lotse-codec = { workspace = true, features = ["test-util"] }
lotse-core = { workspace = true, features = ["test-util"] }
lotse-http.workspace = true
lotse-ipc.workspace = true
lotse-mux.workspace = true
lotse-rtsp.workspace = true
lotse-supervisor.workspace = true
lotse-testing.workspace = true
lotse-webrtc.workspace = true
lotse-worker.workspace = true
mp4-atom.workspace = true
serde_json.workspace = true
str0m.workspace = true
tokio = { workspace = true, features = ["net", "time", "io-util", "macros"] }
tokio-util.workspace = true
url.workspace = true

[[bin]]
name = "ipc_message"
path = "fuzz_targets/ipc_message.rs"
test = false
doc = false
bench = false

