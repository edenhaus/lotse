[package]
name = "lotse-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets; its own workspace because libfuzzer-sys needs nightly"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]

# Its own workspace, so its own fuzz/Cargo.lock: committed, built with `--locked` and checked by
# cargo-deny like the root's. The registry crates take the root workspace's features,
# `default-features = false` first.
[dependencies]
bytes = { version = "1", default-features = false }
libfuzzer-sys = { version = "0.4", default-features = false, features = ["link_libfuzzer"] }
lotse-api = { path = "../crates/lotse-api" }
lotse-api-types = { path = "../crates/lotse-api-types" }
lotse-codec = { path = "../crates/lotse-codec", features = ["test-util"] }
lotse-core = { path = "../crates/lotse-core" }
lotse-http = { path = "../crates/lotse-http" }
lotse-ipc = { path = "../crates/lotse-ipc" }
lotse-rtsp = { path = "../crates/lotse-rtsp" }
lotse-supervisor = { path = "../crates/lotse-supervisor" }
lotse-testing = { path = "../crates/lotse-testing" }
lotse-webrtc = { path = "../crates/lotse-webrtc" }
lotse-worker = { path = "../crates/lotse-worker" }
serde_json = { version = "1", default-features = false, features = ["std"] }
# Without its default features, as in the root: they link aws-lc-rs, which .cargo/deny.toml bans.
str0m = { version = "0.24", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util", "macros"] }
tokio-util = { version = "0.7", default-features = false }
url = { version = "2", default-features = false, features = ["std"] }

[[bin]]
name = "ipc_message"
path = "fuzz_targets/ipc_message.rs"
test = false
doc = false
bench = false

