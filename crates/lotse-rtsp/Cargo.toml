[package]
name = "lotse-rtsp"
description = "RTSP source on retina, with the backchannel extension point."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bytes = { workspace = true }
futures-util = { workspace = true } # `FutureExt`: a request's future mapped into its deadline's result
retina = { workspace = true } # the RTSP client: `DESCRIBE`, `SETUP`, `PLAY` and the keepalives, its sans-I/O core on the source's own TCP connection and its tokio session through the relay, the stream's RTP, and the backchannel's `rtp::Sender`
serde = { workspace = true }
serde_json = { workspace = true }
sdp-types = { workspace = true } # the camera's backchannel media: payload type and `a=ptime`
socket2 = { workspace = true } # `TCP_QUICKACK` on the relay's side of retina's connection, whose Nagle would hold the backchannel's packets
tokio = { workspace = true, features = ["macros", "net", "io-util", "sync"] } # `select!` over packets and cancellation; the `rtsps` relay's sockets and copy loop; `sync`: the TCP relay's wake-up when a receiver report is first scheduled, the relay listener's turn, and the backchannel's queue
tokio-util = { workspace = true } # the backchannel session's close: dropping the talker's session cancels its task
tracing = { workspace = true }
tracing-core = { workspace = true } # retina's events written as events of the source's own (`retina_log`)
tracing-subscriber = { workspace = true } # `retina_log`: the layer between retina's events and the one that writes the lines
url = { workspace = true } # the URL of retina's requests: the source URL itself, or through the relay its host replaced by the relay's address
lotse-codec = { workspace = true }
lotse-core = { workspace = true }
lotse-tls = { workspace = true } # `rtsps`: the certificate check and the TLS stream to the camera

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] } # the end-to-end tests against the fake camera
lotse-core = { workspace = true, features = ["test-util"] } # the fake clock
lotse-testing = { workspace = true } # the fake camera and the source harness

[lints]
workspace = true
