[package]
name = "lotse"
description = "Memory-safe media daemon for IP cameras."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# The binary is the only place that names a concrete source, output or transcoder. Each source and
# output sits behind a feature so `info.schemes` / `info.outputs` follow what was compiled in; the
# transcoders are plain computation on the side branch and always registered; `cargo hack check
# --each-feature` keeps every combination building. A feature gains its `dep:` the moment the
# factory registration exists.
[features]
default = ["source-rtsp", "source-http", "output-webrtc", "output-clip"]
source-rtsp = ["dep:lotse-rtsp"] # the RTSP source factory
source-http = ["dep:lotse-http"] # the HTTP source factory: HLS and MPEG-TS over `http` and `https`
output-webrtc = ["dep:lotse-webrtc"] # the WebRTC session output factory
output-clip = ["dep:lotse-mux"] # the event clips' fragmented MP4 container
source-fake = ["lotse-core/test-util"] # the `fake://` source of lotse-core's fakes, for tests and development only

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true } # the WebSocket halves of `lotse ctl`
http-body-util = { workspace = true } # `lotse ctl stream clip`: the empty GET body and the clip's body read frame by frame
hyper = { workspace = true, features = ["client"] } # `lotse ctl stream clip`: the GET of the clip's body over the control socket (`client::conn::http1`), which tells a whole chunked body from a cut one
hyper-util = { workspace = true } # `TokioIo` between the Unix stream of that request and hyper
log = { workspace = true } # the logger that bridges the `log` records of the crates below
rustix = { workspace = true, features = ["process"] } # the starting uid, the default of `allow_uid`
serde = { workspace = true }
serde_json = { workspace = true } # `lotse ctl` frames
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "macros", "signal", "fs", "io-util", "io-std"] } # `lotse ctl`'s runtime and Unix socket; Ctrl-C stops `lotse ctl stream clip`'s clip, while its events and its body are read at once and its file and stdout are written on the blocking pool
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true } # the `log` records as `tracing` events
lotse-api-types = { workspace = true }
lotse-codec = { workspace = true } # the AAC-LC → Opus transcoder, registered in every build
lotse-core = { workspace = true }
lotse-http = { workspace = true, optional = true }
lotse-mux = { workspace = true, optional = true }
lotse-rtsp = { workspace = true, optional = true }
lotse-sandbox = { workspace = true }
lotse-supervisor = { workspace = true }
lotse-webrtc = { workspace = true, optional = true }
lotse-worker = { workspace = true }

[dev-dependencies]
lotse-core = { workspace = true, features = ["test-util"] } # `FakeClock`: the `log` bridge's throttle
rustix = { workspace = true, features = ["process", "pipe"] } # SIGTERM to the daemon under test, SIGINT to ctl; the size of the stdout pipe the stalled-stdout check fills
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] } # `time`: the bound that fails a hung ctl unit test; the worker-manager and session tests drive a worker; the ICE-TCP viewer frames its connection; the session viewer reads its socket on a task of its own
tokio-util = { workspace = true } # the cancellation token of the ICE-TCP acceptor the signaling test runs
lotse-ipc = { workspace = true } # the talk-back tone test serves a worker in-process and speaks the supervisor's end of its channel
lotse-testing = { workspace = true } # the fake camera and the headless viewer of the session test

[lints]
workspace = true
