[package]
name = "lotse-api"
description = "Control API: axum on a Unix socket with a peer-credential check, an opt-in mutual-TLS listener and WebSocket dispatch."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# `test_util`: a stand-in for the handler's clips, for tests here and in other crates.
[features]
test-util = ["tokio/io-util"]

[dependencies]
axum = { workspace = true }
futures-util = { workspace = true }
hyper = { workspace = true } # the HTTP/1.1 connection with the upgrade limits; `axum::serve` sets none
hyper-util = { workspace = true } # `TokioIo` and the tower-to-hyper adapter for the router
rcgen = { workspace = true } # the TLS listener's self-signed server certificate, made on the first start
rustls = { workspace = true } # the TLS listener: TLS 1.3, the client-pin verifier
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true } # the pairing secret compared in constant time
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "macros"] } # the Unix and TLS listeners, channels
tokio-rustls = { workspace = true } # the TLS listener's handshake on a tokio stream
tokio-util = { workspace = true, features = ["rt", "io"] } # shutdown tokens; `rt`: the pairing redemptions a closed connection still waits for; `io`: a clip's pipe read as a stream of chunks
tracing = { workspace = true }
rustix = { workspace = true, features = ["process", "fs"] } # umask around the bind (`fs` for the mode type)
lotse-api-types = { workspace = true }
lotse-core = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "time"] } # `time`: a real-time bound where a regression would hang a test
lotse-core = { workspace = true, features = ["test-util"] } # `FakeClock` drives the upgrade deadline
tokio-tungstenite = { version = "=0.29.0", default-features = false } # the client side of the tests; axum's own WebSocket engine
lotse-testing = { workspace = true } # the TLS listener's clients, well-behaved and not
tracing-subscriber = { workspace = true } # captures log lines with their spans

# The clip route against `test_util`'s clips.
[[test]]
name = "clip"
required-features = ["test-util"]

[lints]
workspace = true
