[package]
name = "lotse-api"
description = "Control API: axum on a Unix socket, peer-credential check, WebSocket dispatch and snapshot route."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
axum = { workspace = true }
futures-util = { workspace = true }
hyper = { workspace = true } # the HTTP/1.1 connection with the upgrade limits; `axum::serve` sets none
hyper-util = { workspace = true } # `TokioIo` and the tower-to-hyper adapter for the router
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "macros"] } # the Unix and dev TCP listeners, channels
tokio-util = { workspace = true }
tracing = { workspace = true }
rustix = { workspace = true, features = ["process", "fs"] } # umask around the bind (`fs` for the mode type)
lotse-api-types = { workspace = true }
lotse-core = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "time"] } # `time`: a real-time bound where a regression would hang a test
lotse-core = { workspace = true, features = ["test-util"] } # `FakeClock` drives the upgrade deadline
tokio-tungstenite = { version = "0.29", default-features = false } # the client side of the tests; axum's own WebSocket engine
tracing-subscriber = { workspace = true } # captures log lines with their spans

[lints]
workspace = true
