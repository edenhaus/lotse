[package]
name = "rocko"
description = "Memory-safe media daemon for IP cameras."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# The binary is the only place that names a concrete source, output or transcoder. Each source and
# output sits behind a feature so `info.schemes` / `info.outputs` follow what was compiled in; the
# transcoders are plain computation on the side branch and always registered; `cargo hack check
# --each-feature` keeps every combination building. A feature gains its `dep:` the moment the
# factory registration exists.
[features]
default = ["source-rtsp", "source-http", "source-webrtc", "output-webrtc", "output-recording", "output-live", "output-hls"]
source-rtsp = ["dep:rocko-rtsp"] # the RTSP source factory
source-http = ["dep:rocko-http"] # the HTTP source factory: HLS and MPEG-TS over `http` and `https`
source-webrtc = ["dep:rocko-webrtc"] # the `webrtc` source factory: WebRTC cameras whose signaling the control-API client relays (`signaling/*`)
output-webrtc = ["dep:rocko-webrtc"] # the WebRTC session output factory
output-recording = ["dep:rocko-mux"] # the event recordings' fragmented MP4 container
output-live = ["dep:rocko-mux"] # live fMP4 over HTTP: one fragment per frame, the fallback when WebRTC cannot connect
output-hls = ["output-live"] # LL-HLS over HTTP from the live container's fragments, which the supervisor cuts into parts and segments (`limits.*hls*`)
source-fake = ["rocko-core/test-util", "rocko-api-types/test-util"] # the `fake` and `fake-signaled` sources of rocko-core's fakes, and their `stream/put` variants, for tests and development only

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true } # the WebSocket halves of `rocko ctl`
http-body-util = { workspace = true } # `rocko ctl recording create`: the empty GET body and the recording's body read frame by frame
hyper = { workspace = true, features = ["client"] } # `rocko ctl recording create`: the GET of the recording's body over the control socket (`client::conn::http1`), which tells a whole chunked body from a cut one
hyper-util = { workspace = true } # `TokioIo` between the Unix stream of that request and hyper
log = { workspace = true } # the logger that bridges the `log` records of the crates below
rustix = { workspace = true, features = ["process"] } # the starting uid, the default of `allow_uid`
serde = { workspace = true }
serde_json = { workspace = true } # `rocko ctl` frames
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "macros", "fs", "io-util", "io-std"] } # `rocko ctl`'s runtime and Unix socket; `rocko ctl recording create` reads its recording's events and its body at once and writes its file and stdout on the blocking pool
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = { workspace = true } # the `log` records as `tracing` events
rocko-api-types = { workspace = true }
rocko-codec = { workspace = true } # the AAC-LC → Opus transcoder, registered in every build
rocko-core = { workspace = true }
rocko-http = { workspace = true, optional = true }
rocko-mux = { workspace = true, optional = true }
rocko-rtsp = { workspace = true, optional = true }
rocko-sandbox = { workspace = true }
rocko-supervisor = { workspace = true }
rocko-webrtc = { workspace = true, optional = true }
rocko-worker = { workspace = true }

[dev-dependencies]
mp4-atom = { workspace = true } # the recording test reads the daemon's recordings back, as a reader independent of the muxer
rocko-core = { workspace = true, features = ["test-util"] } # `FakeClock`: the `log` bridge's throttle
rustix = { workspace = true, features = ["process"] } # SIGTERM to the daemon under test, SIGINT to ctl, SIGKILL to the worker of a recording
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] } # `time`: the bound that fails a hung ctl unit test; the worker-manager and session tests drive a worker; the ICE-TCP viewer frames its connection; the session viewer reads its socket on a task of its own
tokio-util = { workspace = true } # the cancellation token of the ICE-TCP acceptor the signaling test runs
rocko-ipc = { workspace = true } # the talk-back tone test serves a worker in-process and speaks the supervisor's end of its channel
rocko-testing = { workspace = true } # the fake camera and the headless viewer of the session test; the TLS listener's client of the recording test

[lints]
workspace = true
