[package]
name = "lotse-core"
description = "Tracks, packets, frames, source and sink contracts, registries, fan-out, clock mapping and track negotiation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Fakes for core's own types (`FakeClock`, later the scripted track driver). They cannot live in
# `lotse-testing`, which depends on this crate.
test-util = []

[dependencies]
arc-swap = { workspace = true }
bytes = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true } # `Fingerprint` read and written as its hex string (`fingerprint`)
serde_json = { workspace = true }
sha2 = { workspace = true } # the SHA-256 of a certificate pin (`fingerprint`)
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "time"] } # channels for the fan-out; `select!`; the runtime timer behind `SystemClock::sleep`
tokio-util = { workspace = true, features = ["rt"] } # the backchannel session's close token; `rt`: the tracker of the backchannel sessions' tasks the worker's shutdown waits for
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
allocation-counter = { workspace = true } # the fan-out's allocation count (tests/allocations.rs)
tokio = { workspace = true, features = ["macros", "test-util"] } # `start_paused` tests of the system clock

[lints]
workspace = true
