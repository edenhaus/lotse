[package]
name = "lotse-codec"
description = "Bitstream normalizers, G.711, G.722 and AAC decode, Opus, resampling and transcoders."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# Hand-built parameter sets and a bit writer for other crates' tests (the fake camera).
[features]
test-util = []

[dependencies]
adts-reader = { workspace = true }
bytes = { workspace = true }
h264-reader = { workspace = true }
nanoaudio-g722 = { workspace = true }
opus = { workspace = true }
rubato = { workspace = true }
symphonia-codec-aac = { workspace = true }
symphonia-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] } # `select!` over the input, the stop token and the pacer's next release; the tests' runtime
tokio-util = { workspace = true } # the `CancellationToken` of a running transcoder's `TrackHandle`
tracing = { workspace = true }
lotse-core = { workspace = true }

[dev-dependencies]
divan = { workspace = true } # the microbenchmarks (benches/)
lotse-core = { workspace = true, features = ["test-util"] } # `FakeClock`, so the transcoder tests set each frame's arrival

# The microbenchmarks (`mise run bench`): divan's harness, not libtest's. They build their input
# from the hand-built parameter sets, the recorded AAC and the G.722 encoder of `test-util`.
[[bench]]
name = "video"
harness = false
required-features = ["test-util"]

[[bench]]
name = "audio"
harness = false
required-features = ["test-util"]

[lints]
workspace = true
